<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRZN AI | Help Desk</title>
    <style>
        /* Design system: ADN Visual FRZN */
        :root {
            --bg-dark: #0a1015;
            --gradient-bg: linear-gradient(to bottom, #162029, #0a1015);
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-blue: #7fb3d5;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --radius: 12px;
            --font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --spacing: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            background-image: var(--gradient-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
        }

        /* Contenedor Principal */
        .app-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Header */
        header {
            padding: var(--spacing);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .api-config {
            display: flex;
            gap: 10px;
        }

        .api-config input {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            font-size: 0.85rem;
            width: 250px;
            color: white;
            outline: none;
        }

        .api-config input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-connect {
            padding: 10px 20px;
            background: var(--text-main);
            color: var(--bg-dark);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .btn-connect:hover { transform: scale(1.05); }

        /* Chat Window */
        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing);
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Messages */
        .message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: var(--radius);
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent-blue);
            color: var(--bg-dark);
            font-weight: 500;
        }

        /* Typing Indicator */
        #typing-indicator {
            display: none;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-style: italic;
            margin-left: 5px;
        }

        /* Footer */
        footer {
            padding: var(--spacing);
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            resize: none;
            height: 60px;
            max-height: 200px;
            color: white;
            font-family: inherit;
            outline: none;
            overflow-y: hidden;
        }

        .btn-send {
            height: 60px;
            padding: 0 30px;
            background: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="glass">

    <div class="app-container glass">
        <header>
            <div class="brand">
                <h1>FRZN AI</h1>
            </div>
            <div class="api-config">
                <input type="password" id="api-key-input" placeholder="Tu API Key (sk-...)">
                <button class="btn-connect" id="btn-connect" onclick="saveApiKey()">Conectar</button>
            </div>
        </header>

        <main class="chat-window" id="chat-body">
            <!-- Mensaje inicial -->
            <div class="message bot">
                <b>Asistente IA:</b><br>
                Bienvenido al centro de soporte de FRZN. Por favor, conecta tu API Key para comenzar la asistencia inteligente.
            </div>
            <!-- Indicador de escritura -->
            <div id="typing-indicator">FRZN AI está pensando...</div>
        </main>

        <footer>
            <textarea id="user-input" placeholder="Escribe tu duda técnica aquí..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
            <button class="btn-send" id="btn-send" onclick="sendMessage()">Enviar</button>
        </footer>
    </div>

    <script>
        /* Módulo 1 → Estado: variables globales (apiKey, conversationHistory) */
        let apiKey = '';
        let conversationHistory = [];

        /* MÓDULO 2 — RAG (base de conocimiento): */
        let KNOWLEDGE_BASE = "";

        async function loadKnowledgeBase() {
            try {
                const response = await fetch('./catalogo.txt');
                if (!response.ok) throw new Error("Archivo de catálogo no encontrado.");
                KNOWLEDGE_BASE = await response.text();
                
                // Una vez cargada la base, construimos el System Prompt
                updateSystemPrompt();
                console.log("Base de conocimiento cargada con éxito.");
            } catch (error) {
                console.error("Error al cargar RAG:", error);
                addMessage('bot', "Error: No se pudo cargar la base de conocimiento (catalogo.txt).");
            }
        }

        // Ejecución automática al cargar la página
        window.onload = loadKnowledgeBase;

        /* MÓDULO 3 — System Prompt: */
        let SYSTEM_PROMPT = "";

        function updateSystemPrompt() {
            SYSTEM_PROMPT = `Eres el asistente de FRZN.

REGLAS CRÍTICAS:
1. Responde ÚNICAMENTE usando la información del catálogo proporcionado.
2. Si la información no está en el catálogo, di: "Esa información no está disponible. Te recomiendo contactar directamente con FRZN."
3. Tono: profesional y conciso.
4. Nunca inventes datos que no estén en el catálogo.

BASE DE CONOCIMIENTO:
${KNOWLEDGE_BASE}`;
        }

        /* Módulo 4 → API Key: función saveApiKey() */
        function saveApiKey() {
            const input = document.getElementById('api-key-input');
            const btn = document.getElementById('btn-connect');
            const value = input.value.trim();

            if (value.startsWith('sk-')) {
                apiKey = value;
                input.disabled = true;
                btn.innerText = '✓ Conectado';
                btn.disabled = true;
                btn.style.opacity = '0.7';
                console.log("API Key configurada.");
            } else {
                alert("La API Key debe comenzar con 'sk-'");
            }
        }

        /* Módulo 5 → Enviar mensaje: función sendMessage() */
        async function sendMessage() {
            const textarea = document.getElementById('user-input');
            const btnSend = document.getElementById('btn-send');
            const texto = textarea.value.trim();

            if (!texto) return;
            if (!apiKey) {
                alert("Por favor, conecta tu API Key primero.");
                return;
            }

            // Bloquear interfaz
            textarea.value = '';
            textarea.style.height = '60px';
            btnSend.disabled = true;

            // Actualizar historial local y UI
            conversationHistory.push({ role: 'user', content: texto });
            addMessage('user', texto);
            
            showTyping(true);

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        temperature: 0.3,
                        max_tokens: 600,
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            ...conversationHistory
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const aiResponse = data.choices[0].message.content;
                
                // Guardar en historial y mostrar
                conversationHistory.push({ role: 'assistant', content: aiResponse });
                addMessage('bot', aiResponse);

            } catch (error) {
                console.error("Error API:", error);
                addMessage('bot', "Error: " + error.message);
            } finally {
                showTyping(false);
                btnSend.disabled = false;
            }
        }

        /* Módulo 6 → UI helpers: funciones de interfaz */
        function addMessage(role, text) {
            const chatBody = document.getElementById('chat-body');
            const indicator = document.getElementById('typing-indicator');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (role === 'bot') {
                div.innerHTML = `<b>Asistente IA:</b><br>${escapeHtml(text)}`;
            } else {
                div.textContent = text;
            }
            
            chatBody.insertBefore(div, indicator);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTyping(visible) {
            const indicator = document.getElementById('typing-indicator');
            indicator.style.display = visible ? 'block' : 'none';
            const chatBody = document.getElementById('chat-body');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function autoResize(el) {
            el.style.height = '60px';
            el.style.height = el.scrollHeight + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
